<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #161615; color: #ecebe7;
         font-family: "Inter", sans-serif; position: relative; }
  .left { position: absolute; left: 80px; top: 110px; width: 640px; }
  .sub { max-width: 590px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 76px; height: 76px; }
  h1 { font-family: "Inter Display", "Inter", sans-serif; font-weight: 800; font-size: 72px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
  .lede { margin-top: 44px; font-size: 38px; line-height: 1.25; font-weight: 600; }
  .sub { margin-top: 18px; font-size: 27px; line-height: 1.4; color: #a19d95; }
  .url { position: absolute; left: 80px; bottom: 64px; font-size: 24px; color: #a19d95; letter-spacing: 0.01em; }
  .url b { color: #f0a500; font-weight: 600; }
  .page { position: absolute; right: 86px; top: 70px; width: 380px; height: 492px; background: #fff; border-radius: 8px;
          box-shadow: 0 30px 60px rgba(0,0,0,.45); transform: rotate(4deg); padding: 46px 40px; box-sizing: border-box; }
  .line { height: 14px; border-radius: 3px; background: #dcd8d0; margin-bottom: 20px; }
  .bar { height: 18px; border-radius: 2px; background: #111; display: inline-block; vertical-align: middle; }
  .hl { height: 18px; border-radius: 2px; background: rgba(240,165,0,.55); outline: 2px solid #c77a00; display: inline-block; vertical-align: middle; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  .row .line { margin: 0; }
  .gap { height: 18px; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="icon.svg" alt=""><h1>PDF Redactor</h1></div>
    <div class="lede">Redact PDFs in your browser.</div>
    <div class="sub">Text, images and graphics are removed from the file, not just covered, and every result is checked. Your file is never uploaded.</div>
  </div>
  <div class="url">darkflib.github.io/<b>pdf-redact</b></div>
  <div class="page">
    <div class="line" style="width:60%;height:20px;background:#bdb8ae"></div>
    <div class="gap"></div>
    <div class="row"><div class="line" style="width:90px"></div><div class="bar" style="width:150px"></div><div class="line" style="width:40px"></div></div>
    <div class="line" style="width:100%"></div>
    <div class="row"><div class="line" style="width:70px"></div><div class="bar" style="width:200px"></div></div>
    <div class="line" style="width:85%"></div>
    <div class="gap"></div>
    <div class="row"><div class="line" style="width:110px"></div><div class="hl" style="width:130px"></div><div class="line" style="width:50px"></div></div>
    <div class="line" style="width:95%"></div>
    <div class="line" style="width:70%"></div>
    <div class="gap"></div>
    <div class="row"><div class="bar" style="width:120px"></div><div class="line" style="width:150px"></div></div>
    <div class="line" style="width:88%"></div>
    <div class="line" style="width:60%"></div>
  </div>
</body></html>
